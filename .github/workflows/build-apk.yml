name: ساخت APK شیفتالو

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: تنظیم جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تنظیم اندروید
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: تنظیم Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ساخت نسخه نصب‌شونده
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: نام‌گذاری خروجی
        run: cp app/build/outputs/apk/debug/app-debug.apk Shiftaloo.apk

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiftaloo-APK
          path: Shiftaloo.apk
          if-no-files-found: error

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Native Android smoke tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-test.sh

      - name: Save screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Shiftaloo-Android-QA
          path: qa-output/
          if-no-files-found: warn
